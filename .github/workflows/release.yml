name: Release

# Tags a commit and publishes a GitHub release with its CHANGELOG section.
# Run it from the Actions tab (or `gh workflow run release.yml -f tag=vX.Y.Z`)
# after the version bump is merged.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create, e.g. v0.6.0"
        required: true
      ref:
        description: "Branch or commit to tag"
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Check tag and version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi
          version=$(sed -n 's/^version: *//p' shard.yml)
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::shard.yml at ${{ inputs.ref }} has version $version, not ${TAG#v}"
            exit 1
          fi

      - name: Extract release notes
        env:
          TAG: ${{ inputs.tag }}
        run: |
          awk -v ver="${TAG#v}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "See CHANGELOG.md for details." > notes.md
          fi
          cat notes.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file notes.md
