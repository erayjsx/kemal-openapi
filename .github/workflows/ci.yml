name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Crystal ${{ matrix.crystal }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: ["1.19.1", latest]
    steps:
      - uses: actions/checkout@v7
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - run: shards install
      - run: crystal tool format --check
        if: matrix.crystal == 'latest'
      - name: ameba
        if: matrix.crystal == 'latest'
        run: |
          mkdir -p bin
          crystal build lib/ameba/src/cli.cr -o bin/ameba
          bin/ameba
      - run: crystal spec --error-trace
      - run: crystal build --no-codegen example/app.cr
