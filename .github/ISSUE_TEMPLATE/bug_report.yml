name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest route and annotation that shows the problem.
      render: crystal
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `crystal --version`, plus the kemal and kemal-openapi versions from shard.lock.
    validations:
      required: true
