name: kemal-openapi
version: 0.6.0

authors:
  - Eray can Topcu <erayjsx@gmail.com>

description: |
  OpenAPI 3.1 documentation generator for Kemal.
  Automatically generates Swagger/OpenAPI specs from annotations, validates requests, and serves Swagger UI.

dependencies:
  kemal:
    github: kemalcr/kemal
    version: ~> 1.14

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: ~> 1.7.0

crystal: '>= 1.19.1'

license: MIT
